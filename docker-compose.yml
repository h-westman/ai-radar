services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: airadar
      POSTGRES_PASSWORD: airadar
      POSTGRES_DB: airadar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
